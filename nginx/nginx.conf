worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Media Streaming MIME Types
    types {
        application/dash+xml               mpd;
        application/vnd.apple.mpegurl      m3u8;
        video/mp4                          mp4;
        video/iso.segment                  m4s;
        text/vtt                           vtt;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 10G;

    # Gzip compression for manifests
    gzip on;
    gzip_types application/dash+xml application/vnd.apple.mpegurl text/vtt;

    upstream client_app {
        server client-admin:3000;
    }

    upstream media_api {
        server media-server:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Static Stream Assets (DASH/HLS segments) with CORS & caching
        location /stream_assets/ {
            alias /var/www/stream_assets/;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            add_header Access-Control-Allow-Headers 'Range, Content-Type';
            add_header Cache-Control "public, max-age=3600";
            expires 1d;
        }

        # Media Server Upload & Admin API
        location /api/v1/admin/ {
            proxy_pass http://media_api/api/v1/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 10G;
        }

        # Client Next.js App
        location / {
            proxy_pass http://client_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
