apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamvault-ingress
  namespace: streamvault
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10G"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, HEAD"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,Range"
spec:
  tls:
    - hosts:
        - streamvault.example.com
      secretName: streamvault-tls-secret
  rules:
    - host: streamvault.example.com
      http:
        paths:
          - path: /api/v1/admin/
            pathType: Prefix
            backend:
              service:
                name: streamvault-media-server
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: streamvault-client-admin
                port:
                  number: 3000
