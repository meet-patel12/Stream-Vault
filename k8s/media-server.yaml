apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamvault-media-server
  namespace: streamvault
  labels:
    app: streamvault-media-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamvault-media-server
  template:
    metadata:
      labels:
        app: streamvault-media-server
    spec:
      containers:
        - name: fastapi-server
          image: streamvault/media-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: streamvault-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: streamvault-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "500m"
              memory: "1024Mi"
            limits:
              cpu: "2000m"
              memory: "4096Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/admin/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/admin/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: stream-assets-volume
              mountPath: /app/public/stream_assets
            - name: uploads-volume
              mountPath: /app/uploads
      volumes:
        - name: stream-assets-volume
          persistentVolumeClaim:
            claimName: stream-assets-pvc
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: streamvault-media-server
  namespace: streamvault
spec:
  type: ClusterIP
  selector:
    app: streamvault-media-server
  ports:
    - name: http
      port: 8000
      targetPort: 8000
