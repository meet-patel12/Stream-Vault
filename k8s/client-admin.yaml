apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamvault-client-admin
  namespace: streamvault
  labels:
    app: streamvault-client-admin
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: streamvault-client-admin
  template:
    metadata:
      labels:
        app: streamvault-client-admin
    spec:
      containers:
        - name: nextjs-app
          image: streamvault/client-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: streamvault-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: streamvault-secrets
                  key: DATABASE_URL
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamvault-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamvault-secrets
                  key: JWT_REFRESH_SECRET
            - name: CDN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: streamvault-secrets
                  key: CDN_SECRET_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: streamvault-client-admin
  namespace: streamvault
spec:
  type: ClusterIP
  selector:
    app: streamvault-client-admin
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamvault-client-hpa
  namespace: streamvault
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamvault-client-admin
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
