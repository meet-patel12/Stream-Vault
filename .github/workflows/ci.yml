name: StreamVault Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  static-analysis-and-typecheck:
    name: TypeScript & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation
        run: npm run typecheck

  python-media-pipeline-tests:
    name: Media Server & Pipeline Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r media_server/requirements.txt

      - name: Run Pipeline Unit Tests
        run: python -m unittest media_server/tests/test_pipeline.py

  container-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [static-analysis-and-typecheck, python-media-pipeline-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Next.js Web App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: streamvault/client-admin:ci-test

      - name: Build Media Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./media_server
          file: ./media_server/Dockerfile
          push: false
          tags: streamvault/media-server:ci-test
